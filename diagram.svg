  <text x="750.0" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111"><tspan>RedlineRAG - Local RAG Pipeline for Terms of Service Risk Auditing</tspan></text>
  <text x="750.0" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555"><tspan>100% offline  ·  no model download  ·  no GPU  ·  no API keys  ·  no system pollution</tspan></text>
