  <text x="450.0" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#fff"><tspan>Sentence-Aware Chunker</tspan></text>
  <text x="450.0" y="492" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#fff"><tspan>paragraphs to sentences,</tspan></text>
